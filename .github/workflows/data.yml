name: data
on:
  workflow_dispatch:
  push:
    paths: ['pipeline/*.py', 'pipeline/run_data.sh', '.github/workflows/data.yml']
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: pip install pillow numpy pyproj shapely h3
      - name: data
        run: bash pipeline/run_data.sh
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Data from OpenStreetMap (Geofabrik Berlin)" || echo "nothing"
          git pull --rebase && git push
